<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fuksia for Gmail</title>
<style>
  :root {
    color-scheme: light dark;
    --accent: #c2405d;
    --bg: #ffffff;
    --text: #1f1f1f;
    --muted: #5f6368;
    --line: #e3e3e3;
    --track: #c4c7c5;
    --seg: #f1f3f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #D85A74;
      --bg: #1b1b1c;
      --text: #e3e3e3;
      --muted: #a9abae;
      --line: #3a3a3e;
      --track: #4a4a4f;
      --seg: #2a2a2d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 300px;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 system-ui, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  header img { width: 24px; height: 24px; }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .label { font-weight: 600; }
  .hint { margin-top: 2px; color: var(--muted); font-size: 12px; }

  /* On/off switch */
  .switch { position: relative; flex: none; width: 36px; height: 20px; }
  .switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .switch span {
    position: absolute; inset: 0; border-radius: 10px;
    background: var(--track); transition: background-color .15s;
    pointer-events: none;
  }
  .switch span::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 14px; height: 14px; border-radius: 50%; background: #fff;
    transition: transform .15s;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Default / Left */
  .seg { display: flex; flex: none; padding: 2px; border-radius: 8px; background: var(--seg); }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; }
  .seg span {
    display: block; padding: 4px 10px; border-radius: 6px;
    color: var(--muted); cursor: pointer; font-weight: 500;
  }
  .seg input:checked + span { background: var(--accent); color: #fff; }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1>Fuksia for Gmail</h1>
  </header>

  <div class="row">
    <div>
      <div class="label" id="dark-label">Dark theme</div>
      <div class="hint">Follows your system's dark mode.</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="dark" role="switch" aria-labelledby="dark-label">
      <span></span>
    </label>
  </div>

  <div class="row">
    <div>
      <div class="label" id="actions-label">Quick actions</div>
      <div class="hint">Archive, Delete… on hover: at the end of the row, or over the sender.</div>
    </div>
    <div class="seg" role="radiogroup" aria-labelledby="actions-label">
      <label><input type="radio" name="actions" value="default"><span>Default</span></label>
      <label><input type="radio" name="actions" value="left"><span>Left</span></label>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
